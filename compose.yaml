services:
  postgres:
    image: postgres:16-alpine
    container_name: atlasrh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlasrh}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ziko1234}
    ports:
      # Port 5433 sur l'hôte mappé vers 5432 dans le conteneur
      # (le port 5432 de l'hôte étant déjà occupé par une instance locale de PostgreSQL)
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-atlasrh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Interface web d'administration PostgreSQL (optionnel - décommenter pour l'utiliser sur http://localhost:5050)
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: atlasrh-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@atlasrh.ma
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data:
    driver: local
