spring:
  application:
    name: atlasrh

  # Configuration de la connexion à la base de données PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5433/atlasrh
    username: myuser
    password: ziko1234
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate - Validation du schéma géré par Liquibase
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Liquibase - Migration de la base de données
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

# SpringDoc OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging
logging:
  level:
    ma.atlasrh: DEBUG
    org.hibernate.SQL: DEBUG
